<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 청첩장</title>
    
    <!-- 고급 서체 -->
    <link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Gowun Dodum', 'Lavishly Yours', serif; 
            line-height: 1.6; 
            color: #2c1810; 
            /* 고급스러운 골드&버건디 톤온톤 배경 */
            background: linear-gradient(135deg, #2c1810 0%, #3d2619 30%, #8b4513 70%, #d4a574 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        #bg-music { display: none; }
        
        .container { max-width: 400px; margin: 0 auto; padding: 20px; position: relative; z-index: 2; }
        .section { 
            /* 톤온톤 크림&골드 */
            background: rgba(212, 165, 116, 0.15); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 165, 116, 0.3);
            margin: 20px 0; 
            padding: 35px; 
            border-radius: 25px; 
            box-shadow: 0 20px 40px rgba(44, 24, 16, 0.3);
            text-align: center;
        }
        
        /* 오프닝 - Lavishly Yours */
        .opening { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            /* 고급 골드 그라데이션 */
            background: linear-gradient(45deg, #d4a574 0%, #b8860b 50%, #8b4513 100%);
            color: #fdf6e3;
            text-shadow: 0 2px 15px rgba(0,0,0,0.5);
            animation: fadeIn 2.5s ease-in;
        }
        .opening h1 { 
            font-family: 'Lavishly Yours', cursive !important;
            font-size: 3.5em; 
            margin-bottom: 25px; 
            letter-spacing: 5px;
        }
        .opening p { 
            font-family: 'Gowun Dodum', sans-serif !important;
            font-size: 1.5em; opacity: 0.95; 
        }
        
        /* 버튼 - 톤온톤 골드 */
        .btn, .map-btn, .copy-btn {
            background: linear-gradient(45deg, #d4a574, #b8860b) !important;
            color: #2c1810 !important;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-family: 'Gowun Dodum', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(212, 165, 116, 0.4);
            text-decoration: none;
            display: inline-block;
            min-width: 120px;
        }
        .btn:hover, .map-btn:hover, .copy-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(212, 165, 116, 0.6);
        }
        
        /* 결혼식 정보 */
        .date { 
            font-family: 'Lavishly Yours', cursive !important;
            font-size: 1.6em; 
            color: #d4a574; 
            font-weight: bold; 
            margin: 20px 0; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .location { 
            background: rgba(253, 246, 227, 0.8); 
            padding: 25px; 
            border-radius: 20px; 
            border: 1px solid rgba(212, 165, 116, 0.3);
        }
        
        /* 지도 버튼 그리드 */
        .map-buttons { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            justify-content: center; 
            margin: 25px 0; 
        }
        .map-btn { flex: 1; min-width: 110px; }
        
        /* 계좌 그리드 */
        .account-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin: 25px 0; 
        }
        .account-item { 
            background: rgba(253, 246, 227, 0.6); 
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid rgba(212, 165, 116, 0.3);
        }
        
        /* D-DAY - 고급 골드 */
        .dday { 
            background: linear-gradient(45deg, #fdf6e3 0%, #d4a574 100%) !important; 
            border: 2px solid rgba(212, 165, 116, 0.5);
            padding: 30px; 
            border-radius: 30px;
            font-size: 1.6em;
        }
        .dday-count { 
            font-family: 'Lavishly Yours', cursive !important;
            font-size: 2.5em; 
            color: #8b4513; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        /* 갤러리 */
        .gallery { 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            display: flex; 
            gap: 20px; 
            padding: 25px 0; 
        }
        .gallery::-webkit-scrollbar { display: none; }
        .gallery-item { 
            min-width: 260px; 
            flex: 0 0 260px; 
            height: 320px; 
            cursor: pointer; 
            border-radius: 25px; 
            overflow: hidden; 
            box-shadow: 0 15px 40px rgba(44, 24, 16, 0.4);
            scroll-snap-align: center;
            transition: all 0.4s ease;
            border: 3px solid rgba(212, 165, 116, 0.3);
        }
        .gallery-item:hover { 
            transform: scale(1.03) translateY(-5px); 
            box-shadow: 0 25px 50px rgba(212, 165, 116, 0.4);
        }
        
        /* 타이틀 강조 */
        h1, h2, h3 { 
            font-family: 'Lavishly Yours', cursive !important;
            color: #8b4513;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        h2 { font-size: 1.9em; margin-bottom: 20px; }
        h3 { font-size: 1.4em; margin-bottom: 20px; }
        
        /* 모달 개선 */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(44, 24, 16, 0.95); 
            z-index: 1000;
            justify-content: center; 
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .nav-arrow { 
            background: rgba(212, 165, 116, 0.9) !important;
            color: #2c1810 !important;
            font-size: 1.8em; 
            padding: 20px;
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: scale(0.9) translateY(30px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
        
        @media (max-width: 480px) { 
            .container { padding: 15px; } 
            .opening h1 { font-size: 2.8em; }
            .gallery-item { min-width: 240px; flex: 0 0 240px; }
        }
    </style>
</head>
<body>
    <!-- 배경음악 -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

    <div class="container">
        <!-- 오프닝 -->
        <section class="opening">
            <h1>We Are Getting Married</h1>
            <p>사랑으로 맺어진 새로운 시작</p>
            <button class="btn" onclick="playVideo()" style="font-size: 1.2em; padding: 18px 36px;">
                결혼식 보러가기
            </button>
        </section>

        <!-- 비디오 -->
        <section class="section video-container" id="videoSection" style="display: none;">
            <video id="weddingVideo" controls style="width: 100%; height: 280px; border-radius: 25px; border: 3px solid rgba(212, 165, 116, 0.4);">
                <source src="your-wedding-video.mp4" type="video/mp4">
            </video>
        </section>

        <!-- 결혼합니다 -->
        <section class="section" id="weddingInfo" style="display: none;">
            <h2>💒 결혼합니다</h2>
            <div class="date">2026년 12월 5일 (일) 오후 12:00</div>
            <div class="location">
                <strong>예식장</strong><br>
                서울특별시 강남구 테헤란로 123<br>
                그랜드호텔 그랜드홀 (지하 2층)
            </div>
        </section>

        <!-- 지도 버튼들 -->
        <section class="section" id="maps" style="display: none;">
            <h3>🗺️ 길찾기</h3>
            <div class="map-buttons">
                <a href="https://map.naver.com/p/search/그랜드호텔" target="_blank" class="map-btn">네이버지도</a>
                <a href="https://map.kakao.com/link/map/그랜드호텔,37.497947,127.027517" target="_blank" class="map-btn">카카오맵</a>
                <a href="https://map.tmap.co.kr/directions?dest=37.497947,127.027517" target="_blank" class="map-btn">티맵</a>
            </div>
        </section>

        <!-- 계좌 -->
        <section class="section" id="accounts" style="display: none;">
            <h3>💌 축의금 입금처</h3>
            <div class="account-grid">
                <div class="account-item">
                    <strong>신랑 측</strong><br>
                    <div>농협 123-456-789012</div>
                    <div>(김신랑 • 부모님성함)</div>
                    <button class="copy-btn" onclick="copyAccount('농협 123-456-789012 (김신랑)')">계좌복사</button>
                </div>
                <div class="account-item">
                    <strong>신부 측</strong><br>
                    <div>국민 987-654-321098</div>
                    <div>(이신부 • 부모님성함)</div>
                    <button class="copy-btn" onclick="copyAccount('국민 987-654-321098 (이신부)')">계좌복사</button>
                </div>
            </div>
        </section>

        <!-- D-DAY -->
        <section class="section dday" id="dday" style="display: none;">
            <div style="font-size: 1.3em; font-family: 'Gowun Dodum', sans-serif;">D-DAY</div>
            <div id="ddayCount" class="dday-count">계산중...</div>
        </section>

        <!-- 갤러리 -->
        <section class="section" id="gallery" style="display: none;">
            <h3>💕 추억의 순간들</h3>
            <div class="gallery">
                <div class="gallery-item" onclick="openModal(0)">
                    <img src="https://via.placeholder.com/260x320/d4a574/2c1810?text=1" alt="사진1">
                </div>
                <div class="gallery-item" onclick="openModal(1)">
                    <img src="https://via.placeholder.com/260x320/b8860b/3d2619?text=2" alt="사진2">
                </div>
                <div class="gallery-item" onclick="openModal(2)">
                    <img src="https://via.placeholder.com/260x320/8b4513/fdf6e3?text=3" alt="사진3">
                </div>
                <div class="gallery-item" onclick="openModal(3)">
                    <img src="https://via.placeholder.com/260x320/d4a574/2c1810?text=4" alt="사진4">
                </div>
                <div class="gallery-item" onclick="openModal(4)">
                    <img src="https://via.placeholder.com/260x320/b8860b/3d2619?text=5" alt="사진5">
                </div>
            </div>
        </section>
    </div>

    <!-- 갤러리 모달 -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <button class="nav-arrow prev" onclick="changeImage(-1)">‹</button>
        <img id="modalImage" src="" alt="확대 사진">
        <button class="nav-arrow next" onclick="changeImage(1)">›</button>
    </div>

    <script>
        let currentImageIndex = 0;
        const galleryImages = [
            'https://via.placeholder.com/500x700/d4a574/2c1810?text=1',
            'https://via.placeholder.com/500x700/b8860b/3d2619?text=2',
            'https://via.placeholder.com/500x700/8b4513/fdf6e3?text=3',
            'https://via.placeholder.com/500x700/d4a574/2c1810?text=4',
            'https://via.placeholder.com/500x700/b8860b/3d2619?text=5'
        ];

        // 음악 재생
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.2;
        bgMusic.play().catch(() => {});

        // 비디오 재생 및 섹션 전환
        function playVideo() {
            document.querySelector('.opening').style.display = 'none';
            document.getElementById('videoSection').style.display = 'block';
            document.getElementById('weddingVideo').play();
            setTimeout(() => {
                document.getElementById('weddingInfo').style.display = 'block';
                document.getElementById('maps').style.display = 'block';
                document.getElementById('accounts').style.display = 'block';
                document.getElementById('dday').style.display = 'block';
                document.getElementById('gallery').style.display = 'block';
            }, 2000);
        }

        // 계좌 복사
        function copyAccount(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('💌 계좌번호가 복사되었습니다!');
            });
        }

        // D-DAY 계산
        function updateDday() {
            const weddingDate = new Date('2026-12-05T12:00:00+09:00');
            const now = new Date();
            const diff = weddingDate - now;
            
            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('ddayCount').textContent = `${days}일 ${hours}시 ${minutes}분 ${seconds}초`;
            } else {
                document.getElementById('ddayCount').textContent = 'Happy Wedding Day! 💍';
            }
        }
        setInterval(updateDday, 1000);
        updateDday();

        // 갤러리 모달
        function openModal(index) {
            currentImageIndex = index;
            document.getElementById('modalImage').src = galleryImages[index];
            document.getElementById('imageModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
        function changeImage(direction) {
            currentImageIndex = (currentImageIndex + direction + galleryImages.length) % galleryImages.length;
            document.getElementById('modalImage').src = galleryImages[currentImageIndex];
        }
    </script>
</body>
</html>
